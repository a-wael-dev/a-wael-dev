<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#grad1)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  
  <!-- Animated particles -->
  <circle cx="100" cy="80" r="3" fill="#fff" opacity="0.6">
    <animate attributeName="cy" values="80;100;80" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="120" r="2" fill="#fff" opacity="0.4">
    <animate attributeName="cy" values="120;140;120" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="90" r="2.5" fill="#fff" opacity="0.5">
    <animate attributeName="cy" values="90;110;90" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="300" r="2" fill="#fff" opacity="0.4">
    <animate attributeName="cy" values="300;320;300" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Code brackets decoration -->
  <text x="50" y="100" font-family="'Courier New', monospace" font-size="120" fill="rgba(255,255,255,0.08)" font-weight="bold">&lt;/&gt;</text>
  <text x="1050" y="350" font-family="'Courier New', monospace" font-size="100" fill="rgba(255,255,255,0.08)" font-weight="bold">{}</text>
  
  <!-- Main content -->
  <g filter="url(#glow)">
    <!-- Name -->
    <text x="600" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="68" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Ahmed Wael
    </text>
    
    <!-- Title with gradient -->
    <text x="600" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="600" fill="url(#grad2)" text-anchor="middle">
      Frontend Developer
    </text>
    
    <!-- Tagline -->
    <text x="600" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e0e7ff" text-anchor="middle" opacity="0.95">
      Crafting Beautiful &amp; Interactive Web Experiences
    </text>
  </g>
  
  <!-- Bottom decorative line -->
  <rect x="400" y="290" width="400" height="3" fill="url(#grad2)" opacity="0.7" rx="2"/>
  
  <!-- Tech stack icons representation -->
  <g opacity="0.85">
    <circle cx="450" cy="330" r="18" fill="rgba(255,255,255,0.15)" stroke="#61dafb" stroke-width="2"/>
    <text x="450" y="337" font-family="Arial" font-size="16" fill="#61dafb" text-anchor="middle" font-weight="bold">R</text>
    
    <circle cx="520" cy="330" r="18" fill="rgba(255,255,255,0.15)" stroke="#f7df1e" stroke-width="2"/>
    <text x="520" y="337" font-family="Arial" font-size="16" fill="#f7df1e" text-anchor="middle" font-weight="bold">JS</text>
    
    <circle cx="590" cy="330" r="18" fill="rgba(255,255,255,0.15)" stroke="#3178c6" stroke-width="2"/>
    <text x="590" y="337" font-family="Arial" font-size="16" fill="#3178c6" text-anchor="middle" font-weight="bold">TS</text>
    
    <circle cx="660" cy="330" r="18" fill="rgba(255,255,255,0.15)" stroke="#06b6d4" stroke-width="2"/>
    <text x="660" y="337" font-family="Arial" font-size="16" fill="#06b6d4" text-anchor="middle" font-weight="bold">TW</text>
    
    <circle cx="730" cy="330" r="18" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="2"/>
    <text x="730" y="337" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">N</text>
  </g>
  
  <!-- Pulse animation on icons -->
  <circle cx="590" cy="330" r="18" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5">
    <animate attributeName="r" values="18;24;18" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
